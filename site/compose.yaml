name: weibelpainting

services:
 web:
  build: ./web
  depends_on:
   - api
  read_only: true
  tmpfs:
   - /tmp
  cap_drop:
   - ALL
  security_opt:
   - no-new-privileges:true
  restart: unless-stopped

 api:
  build: ./api
  environment:
   DATABASE_URL: postgres://weibelpainting_site:${SITE_DB_PASSWORD}@db:5432/weibelpainting?sslmode=disable
   TURNSTILE_SECRET: ${TURNSTILE_SECRET}
   SMTP_HOST: ${SMTP_HOST:-}
   SMTP_PORT: ${SMTP_PORT:-}
   SMTP_USERNAME: ${SMTP_USERNAME:-}
   SMTP_PASSWORD: ${SMTP_PASSWORD:-}
   NOTIFY_FROM: ${NOTIFY_FROM:-}
   NOTIFY_TO: ${NOTIFY_TO:-}
  depends_on:
   db-init:
    condition: service_completed_successfully
  read_only: true
  cap_drop:
   - ALL
  security_opt:
   - no-new-privileges:true
  restart: unless-stopped

 db:
  image: postgres:18-alpine
  environment:
   POSTGRES_USER: benw
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
   POSTGRES_DB: weibelpainting
  volumes:
   - pgdata:/var/lib/postgresql
  ports:
   - 127.0.0.1:5432:5432
  healthcheck:
   test: ["CMD-SHELL", "pg_isready -U benw -d weibelpainting"]
   interval: 5s
   timeout: 3s
   retries: 10
  restart: unless-stopped

 # Creates/updates the API's database role (see db/site-user.sql), then exits.
 db-init:
  image: postgres:18-alpine
  command: ["psql", "-f", "/site-user.sql"]
  environment:
   PGHOST: db
   PGUSER: benw
   PGDATABASE: weibelpainting
   PGPASSWORD: ${POSTGRES_PASSWORD}
   SITE_DB_PASSWORD: ${SITE_DB_PASSWORD}
  volumes:
   - ./db/site-user.sql:/site-user.sql:ro
  depends_on:
   db:
    condition: service_healthy
  user: postgres
  read_only: true
  cap_drop:
   - ALL
  security_opt:
   - no-new-privileges:true
  restart: "no"

 cloudflared:
  image: cloudflare/cloudflared:2026.10.4@sha256:c6c7ae1d5dfdcb094ad344ed68ccffc26635c9c6be80965664c33baf064b0515
  command: tunnel --no-autoupdate run
  environment:
   TUNNEL_TOKEN: ${TUNNEL_TOKEN}
  read_only: true
  cap_drop:
   - ALL
  security_opt:
   - no-new-privileges:true
  restart: unless-stopped

volumes:
 pgdata:
  # Keep the volume created under the old "site" project name.
  name: site_pgdata
