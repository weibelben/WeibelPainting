services:
 web:
  build: ./web
  depends_on:
   - api
  restart: unless-stopped

 api:
  build: ./api
  environment:
   DATABASE_URL: postgres://benw:${POSTGRES_PASSWORD}@db:5432/weibelpainting?sslmode=disable
   TURNSTILE_SECRET: ${TURNSTILE_SECRET}
   SMTP_HOST: ${SMTP_HOST:-}
   SMTP_PORT: ${SMTP_PORT:-}
   SMTP_USERNAME: ${SMTP_USERNAME:-}
   SMTP_PASSWORD: ${SMTP_PASSWORD:-}
   NOTIFY_FROM: ${NOTIFY_FROM:-}
   NOTIFY_TO: ${NOTIFY_TO:-}
  depends_on:
   db:
    condition: service_healthy
  read_only: true
  cap_drop:
   - ALL
  security_opt:
   - no-new-privileges:true
  restart: unless-stopped

 db:
  image: postgres:18-alpine
  environment:
   POSTGRES_USER: benw
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
   POSTGRES_DB: weibelpainting
  volumes:
   - pgdata:/var/lib/postgresql
  ports:
   - 127.0.0.1:5432:5432
  healthcheck:
   test: ["CMD-SHELL", "pg_isready -U benw -d weibelpainting"]
   interval: 5s
   timeout: 3s
   retries: 10
  restart: unless-stopped

 cloudflared:
  image: cloudflare/cloudflared:latest
  command: tunnel --no-autoupdate run
  environment:
   TUNNEL_TOKEN: ${TUNNEL_TOKEN}
  restart: unless-stopped

volumes:
 pgdata:
