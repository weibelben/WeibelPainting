name: Test

on:
  push:
    branches: [main]
    paths:
      - "site/api/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "site/api/**"
      - ".github/workflows/test.yml"

jobs:
  api:
    name: API unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: site/api/go.mod
          cache-dependency-path: site/api/go.sum
      - run: go vet ./...
      - run: go test ./...
